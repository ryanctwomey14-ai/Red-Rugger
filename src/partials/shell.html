<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}/{{canonical}}">
<meta name="theme-color" content="#0B0B0C">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Red Rugger LLC">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}/{{canonical}}">
<meta property="og:image" content="{{url}}/assets/img/og-card.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Red Rugger LLC — real estate investment">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{url}}/assets/img/og-card.png">
<meta name="twitter:image:alt" content="Red Rugger LLC — real estate investment">

<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/img/red-rugger-logo.webp">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300&display=swap">
<link rel="stylesheet" href="assets/css/site.css?v=1787594540">
{{schema}}
<script>
/* Mark the document as script-capable before first paint, so reveal
   animations only hide content that JS is able to reveal. */
(function(){document.documentElement.classList.remove('no-js');
document.documentElement.classList.add('js');})();
</script>
</head>
<body class="{{bodyClass}}">
<a class="skip-link" href="#main">Skip to main content</a>
{{header}}
<main id="main">
{{body}}
</main>
{{footer}}
<script src="assets/js/site.js?v=1787594540" defer></script>
</body>
</html>
